# Application Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: ${{ values.name }}-app-config
  labels:
    app.kubernetes.io/instance: ${{ values.name }}
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ${{ values.name }}-app-config
data:
  # Inference model configuration
  INFERENCE_MODEL: "${{ values.inferenceModel | trim }}"

  # Guardrail model for content safety
  GUARDRAIL_MODEL: "${{ values.guardrailModel | trim }}"

  # Model for MCP tool calls
  MCP_TOOL_MODEL: "${{ values.mcpToolModel | trim }}"

  # Embedding model for RAG vector store
  EMBEDDING_MODEL: "${{ values.embeddingModel | trim }}"

  # Embedding dimension (must match embedding model)
  EMBEDDING_DIMENSION: "${{ values.embeddingDimension }}"

  # GitHub repository URL for issue creation
  GITHUB_URL: "${{ values.githubRepoUrl | trim }}"
  {%- if values.deployLlamaStack === 'existing' %}

  # Existing Llama Stack server URL
  LLAMA_STACK_URL: "${{ values.llamaStackUrl | trim }}"

  # TLS verification setting
  LLAMA_STACK_TLS_VERIFY: "${{ values.llamaStackTlsVerify | trim }}"
  {%- endif %}

  # Ingestion configuration path (baked into image)
  INGESTION_CONFIG: "/app-root/config/ingestion-config.yaml"

  # RAG file metadata path (writable location for runtime updates)
  RAG_FILE_METADATA: "/tmp/rag_file_metadata.json"

  # Maximum concurrent workflow threads
  EXECUTOR_WORKERS: "10"

