version: 2
image_name: ogx-agentic

# Migrated to the OGX 1.2.5 API surface. The classic Llama Stack "agents" and
# "safety" APIs were removed; agentic behaviour is now served by the
# responses / skills / interactions / messages APIs. Provider ids are made
# conditional (${env.VAR:+id}) so a provider only registers when its backing
# env var is set, mirroring the upstream "starter" distribution.
apis:
- inference
- tool_runtime
- vector_io
- files
- file_processors
- responses
- skills
- interactions
- messages
- batches

providers:
  inference:
  - provider_id: ${env.OLLAMA_URL:+ollama}
    provider_type: remote::ollama
    config:
      base_url: ${env.OLLAMA_URL:=http://localhost:11434/v1}
  - provider_id: ${env.VLLM_URL:+vllm}
    provider_type: remote::vllm
    config:
      base_url: ${env.VLLM_URL:=}
      api_token: ${env.VLLM_API_KEY:=fake}
      max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
      network:
        tls:
          verify: ${env.VLLM_TLS_VERIFY:=false}
  - provider_id: ${env.OPENAI_API_KEY:+openai}
    provider_type: remote::openai
    config:
      api_key: ${env.OPENAI_API_KEY:=}
      base_url: ${env.OPENAI_BASE_URL:=https://api.openai.com/v1}
  vector_io:
  - provider_id: faiss
    provider_type: inline::faiss
    config:
      persistence:
        namespace: vector_io::faiss
        backend: kv_default
  files:
  - provider_id: builtin-files
    provider_type: inline::localfs
    config:
      storage_dir: ${env.FILES_STORAGE_DIR:=.data/files}
      metadata_store:
        table_name: files_metadata
        backend: sql_default
  file_processors:
  - provider_id: auto
    provider_type: inline::auto
  responses:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        responses:
          table_name: responses
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
      memory_config:
        default_vector_store_provider_id: faiss
  skills:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        namespace: skills
        backend: kv_default
  interactions:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      store:
        table_name: interactions
        backend: sql_default
  messages:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      kvstore:
        namespace: message_batches
        backend: kv_default
  batches:
  - provider_id: reference
    provider_type: inline::reference
    config:
      sqlstore:
        table_name: batches
        backend: sql_default
  tool_runtime:
  - provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
  - provider_id: file-search
    provider_type: inline::file-search

storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.KV_SQL_STORE_DIR:=.data}/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=.data}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      table_name: prompts
      backend: sql_default
    connectors:
      table_name: connectors
      backend: sql_default

registered_resources:
  models: []
  vector_stores: []

server:
  port: 8321

vector_stores:
  default_provider_id: faiss
  default_embedding_model:
    provider_id: ollama
    model_id: all-minilm:l6-v2

connectors: []
