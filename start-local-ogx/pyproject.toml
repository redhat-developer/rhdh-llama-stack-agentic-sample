# OGX Server Dependencies
# This is a minimal pyproject.toml for the OGX (formerly Llama Stack) server container
# Used by Containerfile.ogx

[project]
name = "ogx-server"
version = "0.1.0"
description = "OGX Agentic AI Server"
requires-python = ">=3.12"
dependencies = [
    # Core OGX (formerly Llama Stack) - pinned to 1.2.5
    "ogx==1.2.5",
    "ogx-client==1.2.5",
    "ogx-api==1.2.5",

    # MCP (Model Context Protocol) for tool runtime
    "mcp>=1.23.1",
    
    # Vector database - using faiss instead of milvus to avoid mmap issues in OpenShift
    "faiss-cpu>=1.7.4",
    
    # Database for persistence
    "aiosqlite>=0.20.0",
    
    # HTTP client and OpenAI provider
    "httpx>=0.28.0",
    "openai>=1.82.0",
    
    # Ollama client (required for remote::ollama provider)
    "ollama>=0.6.1",
    
    # YAML config parsing
    "pyyaml>=6.0.3",
    
    # Character encoding detection (required for file processing in vector stores)
    "chardet>=5.2.0",

    # Document conversion for the file_processors "auto" provider
    # (the inline::auto provider declares chardet + pypdf + markitdown[all])
    "pypdf>=6.13.0",
    "markitdown[all]>=0.1.0",
]
